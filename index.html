<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Litpax Marketing Hub — Login</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body class="login-page">
<div class="login-wrap">
  <div class="brand">
    <div class="brand-logo"><svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
    <h1>Litpax Marketing Hub</h1>
    <p>Marketing Command Center</p>
  </div>
  <div class="login-card">
    <h2>Enter your PIN</h2>
    <label for="pinInput">4-digit PIN</label>
    <input type="password" class="pin-input" id="pinInput" maxlength="4" placeholder="••••" inputmode="numeric" autocomplete="off"/>
    <button class="login-btn" id="loginBtn">Login</button>
    <div class="login-error" id="errMsg"></div>
    <div class="login-hint">🔒 Owner · Employee · Marketing Agency</div>
  </div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="login.js"></script>
</body>
</html>
